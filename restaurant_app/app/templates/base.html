<!doctype html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Restaurant App{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #0b1220;
    }

    body.light-bg {
      background: #f7f9fc;
      color: #212529;
    }

    body.light-bg .text-white {
      color: #000 !important;
    }

    body.light-bg .btn-outline-light {
      color: #212529;
      border-color: #ced4da;
    }

    .card {
      border-radius: 16px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: .5px;
    }
  </style>
</head>

<body class="{% block body_class %}{% endblock %}">
  <div class="container py-5" style="max-width: 820px;">
    <div class="text-white mb-4 d-flex justify-content-between align-items-center">
      <div class="brand">🍽️ Restaurant Platform</div>
      <div>
        {% if current_user.is_authenticated %}
        <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.logout') }}">退出</a>
        {% else %}
        <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.login') }}">登录</a>
        {% endif %}
      </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{cat}}">{{ msg }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>

</html>
