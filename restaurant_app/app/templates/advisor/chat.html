<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI商业顾问 - {{ restaurant.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    .message {
      margin-bottom: 1.2rem;
      padding: 0.8rem;
      border-radius: 0.8rem;
      position: relative;
      max-width: 80%;
    }

    .message.user {
      background-color: #e3f2fd;
      margin-left: auto;
      text-align: right;
    }

    .message.assistant {
      background-color: #f5f5f5;
      margin-right: auto;
    }

    .message .meta {
      font-size: 0.75rem;
      color: #6c757d;
      margin-top: 0.4rem;
    }

    .message .delete-btn {
      background: none;
      border: none;
      color: #dc3545;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
      margin-left: 0.5rem;
    }

    .chat-container {
      height: 80vh;
      display: flex;
      flex-direction: column;
    }

    #chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .input-area {
      padding: 1rem;
    }

    .chat-header {
      padding: 1rem 0;
      border-bottom: 1px solid #dee2e6;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container py-4" style="max-width: 980px;">
    <!-- 顶部栏 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex align-items-center gap-3">
        {% if restaurant.logo_path %}
        <img src="{{ url_for('static', filename=restaurant.logo_path) }}"
          style="width:48px;height:48px;border-radius:12px;object-fit:cover;">
        {% endif %}
        <div>
          <div class="fs-4 fw-bold">{{ restaurant.name }}</div>
          <div class="text-muted small">AI商业顾问</div>
        </div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" href="{{ url_for('manage.index', restaurant_id=restaurant.id) }}">返回管理</a>
      </div>
    </div>

    <div class="card shadow-sm rounded-4">
      <div class="card-body p-0">
        <!-- 聊天区域 -->
        <div class="chat-container">
          <!-- 标题栏 -->
          <div class="chat-header text-center bg-light">
            <h5 class="mb-0">AI商业顾问</h5>
            <small class="text-muted">我可以分析您的餐厅数据，提供商业建议</small>
          </div>

          <!-- 加载更多 -->
          <div class="text-center py-2">
            <button id="load-more" class="btn btn-sm btn-outline-secondary">加载更多</button>
          </div>

          <!-- 消息显示区 -->
          <div id="chat-box" class="overflow-auto">
            {% for msg in messages %}
            <div class="message {{ msg.role }}" data-id="{{ msg.id }}">
              <div class="message-content">
                <strong>{{ "您" if msg.role == 'user' else "商业顾问" }}:</strong> {{ msg.content }}
              </div>
              <div class="meta">
                <span class="timestamp">[{{ msg.created_at.strftime("%Y-%m-%d %H:%M") }}]</span>
              </div>
            </div>
            {% endfor %}
          </div>

          <!-- 输入区 -->
          <div class="input-area border-top bg-white">
            <div class="input-group">
              <input type="text" id="msg-input" class="form-control" placeholder="向AI商业顾问提问，例如：哪个客人消费最多？..." autocomplete="off">
              <button id="send-btn" class="btn btn-primary">发送</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let offset = document.querySelectorAll('#chat-box .message').length;
    let sending = false;

    const $chatBox = $('#chat-box');
    const $input = $('#msg-input');
    const $sendBtn = $('#send-btn');

    function scrollToBottom() {
      const box = document.getElementById('chat-box');
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function nowText() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${d} ${hh}:${mm}`;
    }

    function makeMessageHtml(msg) {
      const role = msg.role || 'user';
      const displayName = role === 'user' ? '您' : '商业顾问';
      const idAttr = msg.id ? `data-id="${msg.id}"` : '';
      const tempAttr = msg._temp ? `data-temp="1"` : '';
      return `
        <div class="message ${escapeHtml(role)}" ${idAttr} ${tempAttr}>
          <div class="message-content">
            <strong>${escapeHtml(displayName)}:</strong> ${escapeHtml(msg.content)}
          </div>
          <div class="meta">
            <span class="timestamp">[${escapeHtml(msg.timestamp)}]</span>
          </div>
        </div>
      `;
    }

    function appendMessage(msg) {
      $chatBox.append(makeMessageHtml(msg));
      scrollToBottom();
    }

    function sendMessage() {
      if (sending) return;

      const content = $input.val().trim();
      if (!content) return;

      sending = true;
      $sendBtn.prop('disabled', true);
      $input.prop('disabled', true);

      // 临时显示用户消息
      const tempMsg = {role: 'user', content, timestamp: nowText(), _temp: true};
      const $tempEl = $(makeMessageHtml(tempMsg));
      $chatBox.append($tempEl);
      scrollToBottom();
      $input.val('');

      // 发送消息到服务器
      $.post('{{ url_for("advisor.send_message", restaurant_id=restaurant.id) }}', {content})
        .done(function (data) {
          if (!data || data.status !== 'success') {
            alert('发送失败：服务器返回异常');
            $tempEl.remove();
            return;
          }

          // 删除临时消息
          $tempEl.remove();

          // 确保角色存在
          data.user_msg.role = data.user_msg.role || 'user';
          data.bot_msg.role = data.bot_msg.role || 'assistant';

          appendMessage(data.user_msg);
          appendMessage(data.bot_msg);

          // 已显示消息数 +2（用户+bot）
          offset += 2;
        })
        .fail(function () {
          alert('发送失败，请检查网络或服务器');
          $tempEl.remove();
        })
        .always(function () {
          sending = false;
          $sendBtn.prop('disabled', false);
          $input.prop('disabled', false);
          $input.focus();
        });
    }

    // 点击发送
    $sendBtn.on('click', sendMessage);

    // 回车发送
    $input.on('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 加载更多
    $('#load-more').on('click', function () {
      $.post('{{ url_for("advisor.load_more", restaurant_id=restaurant.id) }}', {offset: offset}, function (data) {
        if (!data || data.length === 0) {
          $('#load-more').prop('disabled', true).text('没有更多了');
          return;
        }

        data.reverse().forEach(msg => {
          // 确保 role 存在
          msg.role = msg.role || 'user';
          $chatBox.prepend(makeMessageHtml(msg));
        });

        offset += data.length;

        const newHeight = $chatBox[0].scrollHeight;
        $chatBox.scrollTop(newHeight - oldHeight);
      });
    });

    $(document).ready(scrollToBottom);
  </script>
</body>

</html>
